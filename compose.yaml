services:
  db:
    image: postgres:18.4-trixie
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${POSTGRESS_PORT:-5432}:5432"
    volumes:
      - petlife-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  petlife-db-data:
